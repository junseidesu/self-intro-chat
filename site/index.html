<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小松 潤成（からん）| 自己紹介</title>
  <meta name="description" content="小松 潤成（からん）の自己紹介。AIに僕のことを質問できます。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E3%81%8B%3C/text%3E%3C/svg%3E">
  <!-- CSS/JS を変えたら ?v= の数字を上げる（古い HTML と新しい JS が混ざらないように） -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <!-- 見出しの名前・ひとこと・リンクはここを直接書き換える（profile.md とは別） -->
  <header class="profile">
    <div class="avatar" aria-hidden="true">か</div>
    <div class="profile-text">
      <h1>小松 潤成 <span class="nickname">からん</span></h1>
      <p class="tagline">京大合唱団 Bass／京大理学部 理論化学研究室 4回生。気分屋で、仕事人間かも。</p>
      <nav class="links" aria-label="リンク">
        <a href="https://github.com/junseidesu" rel="noopener" target="_blank">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="chat">
    <div id="log" class="log" aria-live="polite">
      <div class="bubble assistant">からんです。僕について気になること、なんでも聞いてな。</div>
    </div>

    <div id="suggestions" class="suggestions" aria-label="質問の例">
      <button type="button">どんな人？</button>
      <button type="button">研究って何してるの？</button>
      <button type="button">合唱団でやってきたことは？</button>
      <button type="button">流しそうめんの話して</button>
      <button type="button">作ったツールは？</button>
    </div>
  </main>

  <form id="form" class="composer">
    <label for="input" class="visually-hidden">質問</label>
    <textarea id="input" rows="1" maxlength="500" placeholder="質問を入力（Enterで送信）" required></textarea>
    <button id="send" type="submit">送信</button>
  </form>

  <script src="config.js?v=2"></script>
  <script src="chat.js?v=1"></script>
</body>
</html>
