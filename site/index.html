<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自己紹介</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>自己紹介</h1>
    <p>AIに僕のことを聞いてみてください。</p>

    <div id="log" aria-live="polite"></div>

    <form id="form">
      <label for="input" class="visually-hidden">質問</label>
      <textarea id="input" rows="2" maxlength="500" placeholder="質問を入力…" required></textarea>
      <button id="send" type="submit">送信</button>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
