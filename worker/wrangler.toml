name = "self-intro-chat"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# カンマ区切り。公開時に GitHub Pages の URL を追加する
ALLOWED_ORIGINS = "https://junseidesu.github.io,http://localhost:5500,http://127.0.0.1:5500"
# サイト全体で1日（日本時間）に Claude を呼べる回数
DAILY_LIMIT = "200"

# 同じ IP からは1分に10回まで
[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# 1日の利用回数を数える。id は初回デプロイ時に自動で作られる
[[kv_namespaces]]
binding = "USAGE"

# profile.md / prompt.md を文字列として Worker に同梱する
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
