name = "self-intro-chat"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# カンマ区切り。公開時に GitHub Pages の URL を追加する
ALLOWED_ORIGINS = "http://localhost:5500,http://127.0.0.1:5500"

# profile.md / prompt.md を文字列として Worker に同梱する
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
